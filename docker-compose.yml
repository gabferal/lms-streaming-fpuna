name: lms-streaming

# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   kafka       – Apache Kafka 3.8 (KRaft mode, no Zookeeper)
#   kafka-init  – one-shot topic creation
#   kafka-ui    – Kafka web UI (http://localhost:8080)
#   pipeline    – Apache Beam DirectRunner (streaming)
#   producer    – event replay + scenario injection
#   consumer    – terminal display of lms-metrics
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Kafka broker (KRaft — no Zookeeper) ──────────────────────────────────
  kafka:
    image: bitnami/kafka:3.8
    container_name: lms-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_LOG_RETENTION_HOURS=2
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/bitnami/kafka

  # ── Topic initialisation ──────────────────────────────────────────────────
  kafka-init:
    image: bitnami/kafka:3.8
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo '==> Creating Kafka topics...' &&
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic lms-events   --partitions 4 --replication-factor 1 &&
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic lms-metrics  --partitions 4 --replication-factor 1 &&
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic lms-dlq      --partitions 1 --replication-factor 1 &&
      echo '==> Topics created:' &&
      kafka-topics.sh --bootstrap-server kafka:9092 --list
      "
    restart: on-failure

  # ── Kafka web UI ──────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lms-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ── Beam streaming pipeline ───────────────────────────────────────────────
  pipeline:
    build: .
    container_name: lms-pipeline
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INPUT_TOPIC:  lms-events
      OUTPUT_TOPIC: lms-metrics
      DLQ_TOPIC:    lms-dlq
      OUTPUT_DIR:   /app/output
      WINDOW_SECONDS: "300"
      ALLOWED_LATENESS_SECONDS: "120"
    command: ["python", "-m", "src.pipeline"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./output:/app/output

  # ── Event replay producer ─────────────────────────────────────────────────
  # Run once: docker compose run --rm producer
  producer:
    build: .
    container_name: lms-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INPUT_TOPIC: lms-events
      DATA_FILE:   /app/data/events.jsonl
      REPLAY_SPEED: "1.0"
    command: ["python", "-m", "src.producer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    profiles: ["tools"]

  # ── Metrics consumer (display) ────────────────────────────────────────────
  # Run: docker compose run --rm consumer
  consumer:
    build: .
    container_name: lms-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTPUT_TOPIC: lms-metrics
    command: ["python", "-m", "src.consumer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    profiles: ["tools"]

volumes:
  kafka-data:
