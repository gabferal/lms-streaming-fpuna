name: lms-streaming

services:

  kafka:
    image: apache/kafka:3.7.1
    container_name: lms-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 2
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo '==> Creating Kafka topics...' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic lms-events   --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic lms-metrics  --partitions 4 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic lms-dlq      --partitions 1 --replication-factor 1 &&
      echo '==> Topics created:' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lms-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  pipeline:
    build: .
    container_name: lms-pipeline
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INPUT_TOPIC:  lms-events
      OUTPUT_TOPIC: lms-metrics
      DLQ_TOPIC:    lms-dlq
      OUTPUT_DIR:   /app/output
      WINDOW_SECONDS: "300"
      ALLOWED_LATENESS_SECONDS: "120"
      EARLY_TRIGGER_SECONDS: "30"
    command: ["python", "-m", "src.pipeline"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./output:/app/output
      - ./src:/app/src

  producer:
    image: lms-streaming-pipeline
    container_name: lms-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INPUT_TOPIC: lms-events
      DATA_FILE:   /app/data/events.jsonl
      REPLAY_SPEED: "100"
    command: ["python", "-m", "src.producer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    profiles: ["tools"]

  consumer:
    image: lms-streaming-pipeline
    container_name: lms-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTPUT_TOPIC: lms-metrics
    command: ["python", "-m", "src.consumer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
    profiles: ["tools"]

volumes:
  kafka-data:
