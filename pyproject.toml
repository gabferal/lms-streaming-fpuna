[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lms-streaming-fpuna"
version = "0.1.0"
description = "Pipeline de streaming en tiempo real para monitoreo de actividad en LMS — Proyecto Integrador FPUNA"
requires-python = ">=3.12"
dependencies = [
    "apache-beam>=2.74.0",
    "confluent-kafka>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
log_cli = true
log_cli_level = "INFO"
